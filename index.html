<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmaps</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b6e4f">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="panel">
      <header>
        <div class="marca"><img src="icon.svg" alt="" width="40" height="40"><h1 id="marca">Farmaps</h1></div>
        <p class="lema">El precio más bajo y la farmacia más cercana.</p>
      </header>

      <form id="buscador" autocomplete="off">
        <label for="q">Medicamento</label>
        <div class="fila">
          <input id="q" name="q" list="sugerencias" placeholder="Ej: paracetamol 500" enterkeyhint="search" autocapitalize="off" required>
          <button type="submit">Buscar</button>
        </div>
        <datalist id="sugerencias"></datalist>
      </form>

      <label class="interruptor">
        <input type="checkbox" id="soloTurno">
        <span>Mostrar en el mapa solo farmacias de turno</span>
      </label>

      <label class="interruptor">
        <input type="checkbox" id="soloLocal" checked>
        <span>Solo precios de farmacias con local cerca (5 km)</span>
      </label>

      <p id="donde" class="donde"></p>
      <p id="aviso" class="aviso" hidden></p>
      <section id="resultados" aria-live="polite"></section>
      <section id="locales" aria-live="polite"></section>

      <footer>
        Precios web de cada cadena; en el local pueden variar. Turnos: MINSAL.
        <span class="origen">Nació como Farmagül, 2015.</span>
      </footer>
    </aside>

    <main>
      <div id="mapa" aria-label="Mapa de farmacias"></div>
      <button id="ubicarme" type="button">Usar mi ubicación</button>
      <p id="pista">Toca el mapa para fijar otro punto de partida.</p>
    </main>
  </div>

  <dialog id="reporte" aria-labelledby="rTitulo">
    <form id="rForm">
      <h2 id="rTitulo">Cuéntanos qué viste</h2>
      <p class="lema">Tu aviso nos ayuda a corregir precios para todos. No pedimos tus datos.</p>
      <label for="rProducto">Producto</label>
      <select id="rProducto" required></select>
      <label for="rTipo">¿Qué pasó?</label>
      <select id="rTipo">
        <option value="precio_distinto">El precio era distinto</option>
        <option value="sin_stock">No había stock</option>
        <option value="otro">Otra cosa</option>
      </select>
      <div id="rPrecioCampo">
        <label for="rPrecio">Precio que viste ($)</label>
        <input id="rPrecio" inputmode="numeric" placeholder="Ej: 1290">
      </div>
      <label for="rComentario">Comentario (opcional)</label>
      <textarea id="rComentario" rows="2" maxlength="300" placeholder="Ej: en el local de Av. Matta"></textarea>
      <p id="rEstado" role="status"></p>
      <div class="fila">
        <button type="button" id="rCancelar" class="secundario">Cancelar</button>
        <button type="submit" id="rEnviar">Enviar</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
